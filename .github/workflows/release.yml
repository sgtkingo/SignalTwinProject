name: Release (VSCP Display) - bump + assets + notes

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write # Required for pushing the bump commit, tags, and GitHub Release assets.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate - decide bump type from commit message
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          # Read the message from the checked-out HEAD so the same logic works
          # for both push-triggered and manually-dispatched runs.
          msg="$(git log -1 --pretty=%B)"

          # Prevent an infinite loop: the automated bump commit must not trigger
          # another release run.
          if [[ "$msg" == *"chore(release): bump version to "* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "bump_type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="none"
          if [[ "$msg" == "(major)"* ]]; then bump="major"; fi
          if [[ "$msg" == "(minor)"* ]]; then
            [[ "$bump" != "none" ]] && { echo "Multiple bump markers found." >&2; exit 1; }
            bump="minor"
          fi
          if [[ "$msg" == "(patch)"* ]]; then
            [[ "$bump" != "none" ]] && { echo "Multiple bump markers found." >&2; exit 1; }
            bump="patch"
          fi
          if [[ "$msg" == "(build)"* ]]; then
            [[ "$bump" != "none" ]] && { echo "Multiple bump markers found." >&2; exit 1; }
            bump="build"
          fi

          if [[ "$bump" == "none" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "bump_type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump_type=$bump" >> "$GITHUB_OUTPUT"

      - name: Read VERSION (x.y.z.b) and compute next
        if: ${{ steps.gate.outputs.release == 'true' }}
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "Missing VERSION file (expected x.y.z.b)." >&2
            exit 1
          fi

          V="$(tr -d ' \r\n\t' < VERSION)"

          # Validate x.y.z.b format.
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION '$V' (expected x.y.z.b)." >&2
            exit 1
          fi

          IFS='.' read -r MA MI PA BU <<< "$V"

          # Releases are only allowed from 1.0.0.0 and above.
          if (( MA < 1 )); then
            echo "Version < 1.0.0.0 - release disabled." >&2
            exit 1
          fi

          bump="${{ steps.gate.outputs.bump_type }}"
          case "$bump" in
            major) MA=$((MA + 1)); MI=0; PA=0; BU=0 ;;
            minor) MI=$((MI + 1)); PA=0; BU=0 ;;
            patch) PA=$((PA + 1)); BU=0 ;;
            build) BU=$((BU + 1)) ;;
            *) echo "Unknown bump type: $bump" >&2; exit 1 ;;
          esac

          NEXT="${MA}.${MI}.${PA}.${BU}"
          TAG="v${NEXT}"

          echo "current=$V" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump VERSION, commit and push
        if: ${{ steps.gate.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          printf "%s\n" "${{ steps.ver.outputs.next }}" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.next }}"
          git push origin HEAD:main

      - name: Refresh checkout to latest main
        if: ${{ steps.gate.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # Refresh the workspace so release assets and the tag are produced
          # from the newest state on main, including the version bump commit.
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

      - name: Prepare release assets (copy build outputs -> bin/latest)
        if: ${{ steps.gate.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # The build source can be overridden via BUILD; otherwise use the default path.
          SRC_DEFAULT="ui/build/esp32.esp32.esp32s3"
          if [[ -f BUILD ]]; then
            SRC="$(tr -d ' \r\n\t' < BUILD)"
          else
            SRC="$SRC_DEFAULT"
          fi

          if [[ ! -d "$SRC" ]]; then
            echo "Build source folder not found: $SRC" >&2
            exit 1
          fi

          mkdir -p bin/latest
          rm -f bin/latest/*

          # Copy .bin files first; .elf and .map are optional debug artifacts.
          shopt -s nullglob
          bins=("$SRC"/*.bin)
          if (( ${#bins[@]} == 0 )); then
            echo "No .bin files found in: $SRC" >&2
            exit 1
          fi
          cp -v "$SRC"/*.bin bin/latest/

          # Include debug artifacts when available.
          if compgen -G "$SRC"/*.elf > /dev/null; then cp -v "$SRC"/*.elf bin/latest/; fi
          if compgen -G "$SRC"/*.map > /dev/null; then cp -v "$SRC"/*.map bin/latest/; fi

          echo "Prepared assets in bin/latest from: $SRC"

      - name: Validate assets (bin/latest)
        if: ${{ steps.gate.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "bin/latest" ]]; then
            echo "Missing folder bin/latest" >&2
            exit 1
          fi

          shopt -s nullglob
          files=(bin/latest/*)
          if (( ${#files[@]} == 0 )); then
            echo "No files found in bin/latest" >&2
            exit 1
          fi

      - name: Create and push tag (on bump commit)
        if: ${{ steps.gate.outputs.release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.ver.outputs.tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release (notes + assets)
        if: ${{ steps.gate.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            bin/latest/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
